<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f3a">
  <title>手機講者稿｜守護「腎」利人生</title>
  <link rel="stylesheet" href="speaker.css?v=20260821-speaker-script">
</head>
<body>
  <main class="speaker-app" aria-label="手機講者稿">
    <header class="speaker-top">
      <div>
        <p>守護「腎」利人生</p>
        <h1>手機講者稿</h1>
      </div>
      <a id="projectorLink" class="projector-link" href="index.html#1">投影頁</a>
    </header>

    <section class="slide-card" aria-label="目前投影片">
      <img id="slideThumb" src="slides/slide-01.png?v=20260821-speaker-script" alt="第 1 張投影片縮圖">
      <div class="slide-info">
        <p id="slideCount">第 1 / 34 張</p>
        <h2 id="slideTitle">載入中</h2>
      </div>
    </section>

    <section class="script-panel" aria-label="逐字稿">
      <div class="script-toolbar">
        <label for="slideSelect">跳到</label>
        <select id="slideSelect" aria-label="選擇投影片"></select>
        <button id="smallerText" type="button" aria-label="縮小文字">A-</button>
        <button id="largerText" type="button" aria-label="放大文字">A+</button>
        <button id="wakeLock" type="button">保持亮螢幕</button>
      </div>
      <article id="scriptText" class="script-text" aria-live="polite">
        <p>正在載入逐字稿...</p>
      </article>
    </section>

    <nav class="speaker-controls" aria-label="講者控制">
      <button id="firstSlide" type="button">第一張</button>
      <button id="prevSlide" type="button">上一張</button>
      <button id="nextSlide" type="button">下一張</button>
      <button id="lastSlide" type="button">最後</button>
    </nav>
  </main>
  <script src="speaker-data.js?v=20260821-speaker-script"></script>
  <script src="speaker.js?v=20260821-speaker-script"></script>
</body>
</html>
